<!DOCTYPE html>
<html>
<head>
  <title>CRUD Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui; background:#0f172a; color:white; }
    .container { max-width:600px; margin:auto; padding:20px; }
    input, button { padding:10px; margin:5px; border-radius:8px; }
    button { background:#3b82f6; color:white; cursor:pointer; }
    .item { background:#1e293b; padding:10px; margin:5px; display:flex; justify-content:space-between; }
    .stats { margin:10px 0; font-weight:bold; }
  </style>
</head>

<body>
<div class="container">

  <h1>🚀 CRUD Dashboard</h1>

  <!-- STATS -->
  <div class="stats" id="stats">Total Items: 0</div>

  <!-- INPUT -->
  <input id="name" placeholder="Enter item"/>
  <button onclick="add()">Add</button>

  <!-- LIST -->
  <div id="list"></div>

</div>

<script>
let editingId = null;

// LOAD ITEMS + STATS
async function load() {
  let res = await fetch('/api/items');
  let data = await res.json();

  let statsRes = await fetch('/api/stats');
  let stats = await statsRes.json();

  document.getElementById('stats').innerText = "Total Items: " + stats.total;

  let list = document.getElementById('list');
  list.innerHTML = '';

  data.forEach(i => {
    list.innerHTML += `
      <div class="item">
        ${i.name}
        <div>
          <button onclick="edit(${i.id}, '${i.name}')">✏️</button>
          <button onclick="del(${i.id})">❌</button>
        </div>
      </div>`;
  });
}

// ADD or UPDATE
async function add() {
  let name = document.getElementById('name').value;

  if (editingId) {
    await fetch(/api/items/${editingId}, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name})
    });
    editingId = null;
  } else {
    await fetch('/api/items', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name})
    });
  }

  document.getElementById('name').value = '';
  load();
}

// EDIT MODE
function edit(id, name) {
  document.getElementById('name').value = name;
  editingId = id;
}

// DELETE
async function del(id) {
  await fetch(/api/items/${id}, {method:'DELETE'});
  load();
}

// INITIAL LOAD
load();
</script>
</body>
</html>
